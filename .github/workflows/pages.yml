name: Publish Jelly Bricks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jelly-bricks-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run smoke

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install 3D engine build tools
        run: npm install --no-audit --no-fund
      - name: Build self-hosted 3D PWA
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check actual public release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${PAGE_URL}" ]; then
            echo "::error::No Pages URL was returned. Check Settings > Pages > GitHub Actions."
            exit 1
          fi

          # Verify exact byte-for-byte release, not a cached older version.
          # Cache-busting query parameters can help with Pages CDN propagation.
          assets=(index.html styles.css manifest.webmanifest sw.js app.js)
          for module in src/*.js; do
            assets+=("${module}")
          done
          for attempt in 1 2 3 4 5 6 7 8; do
            all_match=true
            for asset in "${assets[@]}"; do
              destination="${RUNNER_TEMP}/pages-${asset//\//-}"
              if ! curl --fail --location --silent --show-error --max-time 15 \
                "${PAGE_URL%/}/${asset}?release=${GITHUB_SHA}" -o "${destination}" ||
                ! cmp -s "dist/${asset}" "${destination}"; then
                all_match=false
                break
              fi
            done

            if [ "${all_match}" = true ]; then
              {
                echo "### Jelly Bricks published"
                echo "Public URL: ${PAGE_URL}"
                echo "Verified ${#assets[@]} application files byte for byte."
                echo "Commit: ${GITHUB_SHA}"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "GitHub Pages has not propagated this release (attempt ${attempt}/8)."
            sleep 8
          done

          echo "::error::Public site is missing or serves an outdated release. Check the GitHub Pages settings and deployment logs."
          exit 1
