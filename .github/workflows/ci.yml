name: Validate Jelly Bricks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js and build tools
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: npm run check
      - name: Verify puzzle logic and level solvability
        run: npm test
      - name: Smoke test mobile touch in Chromium
        run: npm run smoke
