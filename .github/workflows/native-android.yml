name: Godot Android Native APK

on:
  push:
    branches: [main]
    paths:
      - "native-godot/**"
      - "scripts/check-godot-source.py"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-godot/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One-time remediation for the unsafe cache introduced in Android 0.9.8.
  # The cache may already contain a private key and must be deleted, not just
  # omitted from future runs. This job cannot run on a pull request.
  purge-insecure-signing-cache:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete only the legacy keystore cache key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" \
            --key jelly-bricks-native-debug-keystore-v1 \
            --limit 100 --json id,key \
            --jq '.[] | select(.key == "jelly-bricks-native-debug-keystore-v1") | .id' \
            | while IFS= read -r cache_id; do
                if [[ -n "$cache_id" ]]; then
                  gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
                  echo "Deleted insecure historical debug signing cache id $cache_id"
                fi
              done
  verify-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reject corrupted Godot source bytes
        run: python3 scripts/check-godot-source.py
      - name: Validate local signing bootstrap script syntax
        run: |
          bash -n scripts/setup-android-signing.sh
          bash -n scripts/escrow-android-signing.sh
          bash -n scripts/recover-android-signing.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Download official Godot 4.6 editor and Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.6.stable"
          curl --fail --location --retry 4 --retry-delay 4 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot-editor.zip"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 4 --retry-delay 4 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/export.tpz"
          unzip -q "$RUNNER_TEMP/export.tpz" -d "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/templates/"* \
            "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat >"$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      # NEVER put private signing keys in actions/cache or public artifacts.
      # GitHub documents that pull requests can read base-branch caches.
      # Secrets are only brought into the trusted main workflow step.
      - name: Restore persistent signing identity from repository secrets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SIGNING_B64: ${{ secrets.JELLY_ANDROID_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.JELLY_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.JELLY_ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_B64" && -z "$SIGNING_PASSWORD" && -z "$SIGNING_ALIAS" ]]; then
            echo "::warning::Persistent signing secrets not configured; builds use disposable debug keys and CANNOT update an installed APK signed by a different key."
            exit 0
          fi
          if [[ -z "$SIGNING_B64" || -z "$SIGNING_PASSWORD" || -z "$SIGNING_ALIAS" ]]; then
            echo "::error::All three signing secrets must be configured together."
            exit 1
          fi
          if [[ "$SIGNING_PASSWORD" == *$'\n'* || "$SIGNING_PASSWORD" == *$'\r'* \
                || "$SIGNING_ALIAS" == *$'\n'* || "$SIGNING_ALIAS" == *$'\r'* ]]; then
            echo "::error::Signing secret values must not contain line breaks."
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          if ! keytool -list -keystore "$HOME/.android/debug.keystore" \
                -alias "$SIGNING_ALIAS" -storepass "$SIGNING_PASSWORD" > /dev/null; then
            echo "::error::Unable to verify persistent Android signing identity."
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$SIGNING_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "JELLY_ANDROID_SIGNER_PERSISTENT=1" >> "$GITHUB_ENV"
          echo "Using securely configured persistent signing identity."
      - name: Create isolated temporary debug identity if necessary
        run: |
          set -euo pipefail
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            umask 077
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
            echo "JELLY_ANDROID_SIGNER_PERSISTENT=0" >> "$GITHUB_ENV"
            echo "::notice::Ephemeral APK signer: to preserve Android updates, configure GitHub Actions signing secrets."
          fi
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Verify signing identity and pin the expected certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.JELLY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Public fingerprint; never display or publish a private keystore.
          cert_sha256="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot read Android signing certificate SHA-256."
            exit 1
          fi
          echo "JELLY_ANDROID_ACTUAL_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"
          echo "Android signing certificate SHA-256: $cert_sha256"
          if [[ "$JELLY_ANDROID_SIGNER_PERSISTENT" == "1" ]]; then
            if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::Set repository variable JELLY_ANDROID_CERT_SHA256 before permanent Android signing."
              exit 1
            fi
            expected="$(printf '%s' "$EXPECTED_CERT_SHA256" \
              | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            if [[ "$expected" != "$cert_sha256" ]]; then
              echo "::error::Android keystore differs from pinned certificate; refusing update-incompatible APK."
              exit 1
            fi
            echo "Pinned persistent signing identity verified."
          else
            echo "::warning::Ephemeral debug certificate: this APK cannot reliably update previous Android installations."
          fi
      - name: Import native scene and shaders
        run: |
          set -o pipefail
          "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
            --headless --path native-godot --editor --import --quit 2>&1 \
            | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '(SCRIPT ERROR|Parse Error|Failed to load script)' \
            "$RUNNER_TEMP/godot-import.log"; then
            echo "::error::Godot GDScript parser rejected the native scene"
            exit 1
          fi
      - name: Play and solve all 21 levels in the real Godot engine
        run: |
          timeout --signal=TERM 120s \
            "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
            --headless --rendering-driver dummy --path native-godot --script res://tests/validate.gd
      - name: Verify impact timing on live Godot SceneTree
        run: |
          timeout --signal=TERM 45s \
            "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
            --headless --rendering-driver dummy --path native-godot \
            --script res://tests/impact_feedback.gd
      - name: Verify real OpenGL GPU instancing and render visual QA image
        run: |
          set -euo pipefail
          mkdir -p build
          # Godot dummy driver cannot read MultiMesh buffers. The Mesa
          # rendering step is REQUIRED; retry only a failed Xvfb/GL launch.
          for attempt in 1 2; do
            rm -f build/jelly-native-preview.png build/jelly-stack-preview.png \
              build/jelly-stack-side-preview.png build/jelly-stack-top-preview.png \
              build/jelly-stack-impact-preview.png build/jelly-stack-gallery-preview.png \
              build/jelly-stack-reference-tower-preview.png build/jelly-stack-reference-sway-preview.png \
              build/jelly-stack-reference-fall-preview.png build/jelly-stack-reference-landed-preview.png
            if LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
                -s "-screen 0 720x1280x24" \
                timeout 90s "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
                  --path native-godot --rendering-driver opengl3 \
                  --resolution 720x1280 --script res://tests/capture.gd \
                && test -s build/jelly-native-preview.png \
                && test -s build/jelly-stack-preview.png \
                && test -s build/jelly-stack-side-preview.png \
                && test -s build/jelly-stack-top-preview.png \
                && test -s build/jelly-stack-impact-preview.png \
                && test -s build/jelly-stack-gallery-preview.png \
                && test -s build/jelly-stack-reference-tower-preview.png \
                && test -s build/jelly-stack-reference-sway-preview.png \
                && test -s build/jelly-stack-reference-fall-preview.png \
                && test -s build/jelly-stack-reference-landed-preview.png; then
              echo "Mesa OpenGL visual QA passed on attempt $attempt"
              exit 0
            fi
            echo "::warning::Mesa OpenGL verification failed ($attempt/2)"
          done
          echo "::error::Native visual QA is mandatory and failed both attempts"
          exit 1
      - name: Validate isolated studio Jelly material under three camera angles
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            -s "-screen 0 720x1280x24" \
            timeout 90s "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
              --path native-godot --rendering-driver opengl3 \
              --resolution 720x1280 --script res://tests/reference_brick_capture.gd
          test -s build/reference-brick-three-quarter.png
          test -s build/reference-brick-side.png
          test -s build/reference-brick-top.png
      - name: Render isolated three-brick prototype and assert propagation
        run: |
          set -euo pipefail
          mkdir -p build/three-stack
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            -s "-screen 0 720x1280x24" \
            timeout 90s "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
              --path native-godot --rendering-driver opengl3 \
              --resolution 720x1280 \
              --script res://prototypes/single_brick/three_stack_capture.gd
          for state in 01-rest 02-approach 03-contact 04-wave 05-settled; do
            test -s "build/three-stack/$state.png"
          done
      - name: Verify real physical stack collisions and save GPU reference frames
        run: |
          set -euo pipefail
          mkdir -p build/physics-stack
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            -s "-screen 0 720x1280x24" \
            timeout 90s "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
              --path native-godot --rendering-driver opengl3 \
              --resolution 720x1280 \
              --script res://prototypes/single_brick/physics_stack_verify.gd
          for state in 01-static 02-first-contact 03-collapse 04-settled; do
            test -s "build/physics-stack/$state.png"
          done
      - name: Upload prototype material images for real visual review
        uses: actions/upload-artifact@v4
        with:
          name: jelly-bricks-three-stack-prototype
          path: |
            build/three-stack/*.png
            build/physics-stack/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload real native visual QA image
        uses: actions/upload-artifact@v4
        with:
          name: jelly-bricks-native-visual-qa
          path: |
            build/jelly-native-preview.png
            build/jelly-stack-preview.png
            build/jelly-stack-side-preview.png
            build/jelly-stack-top-preview.png
            build/jelly-stack-impact-preview.png
            build/jelly-stack-gallery-preview.png
            build/jelly-stack-reference-tower-preview.png
            build/jelly-stack-reference-sway-preview.png
            build/jelly-stack-reference-fall-preview.png
            build/jelly-stack-reference-landed-preview.png
            build/reference-brick-three-quarter.png
            build/reference-brick-side.png
            build/reference-brick-top.png
          if-no-files-found: error
          retention-days: 14
      - name: Export signed debug APK for Android
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
            --headless --path native-godot --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/jelly-bricks-native-debug.apk"
          test -s build/jelly-bricks-native-debug.apk
          unzip -t build/jelly-bricks-native-debug.apk | tail -3
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify \
            --verbose --print-certs build/jelly-bricks-native-debug.apk \
            | tee "$RUNNER_TEMP/jelly-apk-signature.txt"
          apk_sha256="$(sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/jelly-apk-signature.txt" \
            | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$apk_sha256" =~ ^[0-9a-f]{64}$ ]] \
            || [[ "$apk_sha256" != "$JELLY_ANDROID_ACTUAL_CERT_SHA256" ]]; then
            echo "::error::Exported APK is unsigned or uses a different certificate from the verified keystore."
            exit 1
          fi
          echo "Verified APK signer matches keystore: $apk_sha256"
      # Separate opt-in Android installation of the experimental physics
      # studio. Do not change the production APK/application ID or publish it.
      - name: Export isolated touch-test Physics Lab APK
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/single-brick-optics-prototype'
        run: |
          set -euo pipefail
          cp native-godot/project.godot "$RUNNER_TEMP/jelly-main-project.godot"
          cp native-godot/export_presets.cfg "$RUNNER_TEMP/jelly-main-presets.cfg"
          restore_game_config() {
            cp "$RUNNER_TEMP/jelly-main-project.godot" native-godot/project.godot
            cp "$RUNNER_TEMP/jelly-main-presets.cfg" native-godot/export_presets.cfg
          }
          trap restore_game_config EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-godot/project.godot")
          s = p.read_text()
          old = 'run/main_scene="res://scenes/main.tscn"'
          assert s.count(old) == 1, "Unexpected production entry point"
          s = s.replace(old,
              'run/main_scene="res://prototypes/single_brick/physics_stack.tscn"')
          s = s.replace('config/name="Jelly Bricks 3D"',
              'config/name="Jelly Bricks Physics Lab"')
          p.write_text(s)
          p = Path("native-godot/export_presets.cfg")
          s = p.read_text()
          old = 'package/unique_name="org.jellybricks.native3d"'
          assert s.count(old) == 2, "Unknown production export preset"
          s = s.replace(old,
              'package/unique_name="org.jellybricks.physicslab"', 1)
          s = s.replace('package/name="Jelly Bricks 3D"',
              'package/name="Jelly Bricks Physics Lab"', 1)
          p.write_text(s)
          PY
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64" \
            --headless --path native-godot --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/jelly-bricks-physics-lab-debug.apk"
          test -s build/jelly-bricks-physics-lab-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify \
            --print-certs build/jelly-bricks-physics-lab-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging \
            build/jelly-bricks-physics-lab-debug.apk \
            | grep -F "package: name='org.jellybricks.physicslab'"
          echo "Physics Lab has its own package ID and cannot overwrite the game."
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/single-brick-optics-prototype'
        with:
          name: jelly-bricks-physics-lab-android-apk
          path: build/jelly-bricks-physics-lab-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: jelly-bricks-android-debug-apk
          path: build/jelly-bricks-native-debug.apk
          retention-days: 14
